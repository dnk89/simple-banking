services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: creates the topics from ADR-002 (3 partitions, replication factor 1
  # for this single-broker local setup), then exits.
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      for topic in payment-events bank-status-events payment-events.retry payment-events.dlt; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1;
      done
      "

  # OpenTelemetry Protocol collector and trace viewer (README's tracing dashboard).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

  payments-api:
    build:
      context: .
      dockerfile: src/Payments.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Payments: Host=postgres;Database=payments;Username=payments;Password=payments
      Kafka__BootstrapServers: kafka:9092
      OTEL_SERVICE_NAME: payments-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "8080:8080"

  bankgateway-worker:
    build:
      context: .
      dockerfile: src/BankGateway.Worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__BankGateway: Host=postgres;Database=payments;Username=payments;Password=payments
      Kafka__BootstrapServers: kafka:9092
      MockBank__BaseUrl: http://mockbank:8080
      OTEL_SERVICE_NAME: bankgateway-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889

  mockbank:
    build:
      context: .
      dockerfile: src/MockBank/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: mockbank
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889

volumes:
  postgres-data:
